[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "spiderfarmer"
version = "0.1.0"
description = "Unofficial Python client for the Spider Farmer cloud API"
readme = "README.md"
requires-python = ">=3.11"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
keywords = ["spider-farmer", "spiderfarmer", "cloud-api", "mqtt", "ggs"]
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
]
dependencies = [
    "cryptography>=44",
    "requests>=2.32",
]

[project.urls]
Homepage = "https://github.com/zeroXmrcl/spider-farmer-cloud-api"
Repository = "https://github.com/zeroXmrcl/spider-farmer-cloud-api"

[project.optional-dependencies]
mqtt = ["paho-mqtt>=2.1"]
dev = ["pytest>=8", "paho-mqtt>=2.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spiderfarmer = ["certs/*.pem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
